[package]
name = "daybridge"
version = "0.1.0"
description = "A floating daily quest board generated from MARU closeout."
authors = ["Daybridge contributors"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
serde_json = "1"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "=0.61.3", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
