[package]
name = "daybridge"
version = "0.1.0"
description = "A floating daily quest board generated from AIHUB closeout."
authors = ["Daybridge contributors"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
